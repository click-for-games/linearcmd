[package]
name = "linearcmd"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
colored = "2.1"
dialoguer = "0.11"
reqwest = { version = "0.12", features = ["json", "multipart", "blocking"] }
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
dirs = "5.0"
zip = "2.2"
flate2 = "1.0"
tar = "0.4"
chrono = { version = "0.4", features = ["serde"] }
indicatif = "0.17"
regex = "1.10"
